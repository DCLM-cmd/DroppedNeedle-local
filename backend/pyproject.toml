[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles==24.1.0",
    "bcrypt>=5.0.0",
    "cryptography>=48.0",
    "fastapi==0.118.3",
    "h2>=4.1,<5",
    "httpx[h2]==0.28.1",
    "msgspec==0.20.0",
    "mutagen>=1.47,<2",
    "packaging>=24.0",
    "pillow>=12.3.0",
    "pydantic==2.12.0",
    "pydantic-core==2.41.1",
    "pydantic-settings==2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25",
    "python-dotenv>=1.2.2",
    "python-multipart==0.0.20",
    "rapidfuzz>=3.14,<4",
    "starlette==0.48.0",
    "unidecode>=1.3,<2",
    "uvicorn[standard]==0.37.0",
]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
# A hung test used to block the whole run indefinitely - the suite never finished and
# reported nothing, so a single deadlock hid every other result. With a per-test cap
# the deadlock is reported as one failure and the remaining tests still run.
# "signal" interrupts the blocked thread in place and lets the session continue;
# "thread" would abort the entire run, which is the behaviour being fixed.
# 30s is five times the slowest legitimate test measured here (6.1s), so it cannot
# fail honest work, while a deadlock is reported in half a minute instead of never.
# A genuinely slow test can raise its own with @pytest.mark.timeout(n).
timeout = 30
timeout_method = "signal"
