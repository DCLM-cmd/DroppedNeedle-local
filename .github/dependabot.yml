# Keep pinned dependencies current. Pins stay exact (requirements*.txt, the
# lockfile); Dependabot opens the bump PRs, you review and merge them.
# group: minor/patch npm bumps fold into one PR so the frontend lockfile is
# touched at most once a week; pip gets individual PRs (requirements*.txt is
# hand-split, a combined bump would mix runtime and dev pins).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
