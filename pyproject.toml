[tool.black]
line-length = 100
target-version = ["py313"]
skip-string-normalization = false
color = true

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
line_length = 100
known_first_party = ["backend"]
default_section = "THIRDPARTY"

[tool.ruff]
# Keep this aligned with Black/isort
target-version = "py313"
src = ["backend"]

[tool.ruff.lint]
select = ["BLE001"]

[dependency-groups]
dev = [
    "aiofiles==24.1.0",
    "bcrypt>=5.0.0",
    "cryptography>=48.0",
    "fastapi==0.118.3",
    "h2>=4.1,<5",
    "httpx[h2]==0.28.1",
    "msgspec==0.20.0",
    "mutagen>=1.47,<2",
    "packaging>=24.0",
    "pydantic==2.12.0",
    "pydantic-core==2.41.1",
    "pydantic-settings==2.3.0",
    "python-dotenv>=1.2.2",
    "python-multipart==0.0.20",
    "rapidfuzz>=3.14,<4",
    "starlette==0.48.0",
    "unidecode>=1.3,<2",
    "uvicorn[standard]==0.37.0",
]
